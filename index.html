<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Master Vijay - PLC/DCS Logic Generator</title>

  <link rel="stylesheet" href="style.css">

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body>

  <div class="container">

    <h1>
      ⚡ AI Master Vijay
      <br>
      <span class="subtitle">
        Advanced PLC / DCS Logic Generator
      </span>
    </h1>

    <!-- PLC MODEL -->
    <div class="selectors">

      <select id="plcModel">

        <option>Allen Bradley - MicroLogix 1400</option>
        <option>Allen Bradley - SLC 500</option>
        <option>Allen Bradley - CompactLogix</option>
        <option>Allen Bradley - ControlLogix</option>
        <option>Siemens S7-1200</option>
        <option>Siemens S7-1500</option>
        <option>Schneider M340</option>

      </select>

    </div>

    <!-- USER PROMPT -->
    <textarea
      id="prompt"
      placeholder="Example:
Generate Lead Lag Pump Logic with Auto Manual Control, Alarm List, Sequence Of Operation and Interlocks">
    </textarea>

    <!-- BUTTONS -->
    <div class="buttons">

      <button onclick="generateLogic()">
        Generate Logic
      </button>

      <button onclick="downloadPDF()">
        Download PDF
      </button>

    </div>

    <!-- LADDER SVG -->
    <div class="ladder-container">

      <svg id="ladderSVG" width="1500" height="1000">

        <line x1="50" y1="20" x2="50" y2="950" class="rail"/>
        <line x1="1450" y1="20" x2="1450" y2="950" class="rail"/>

      </svg>

    </div>

    <!-- OUTPUT -->
    <div id="outputSection"></div>

  </div>

  <script src="script.js"></script>

</body>

</html>
