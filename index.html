<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Master Vijay - PLC Logic Generator</title>

  <link rel="stylesheet" href="style.css">

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body>

  <div class="container">

    <h1>
      ⚡ AI Master Vijay
      <br>
      <span class="subtitle">
        PLC / DCS Logic Generator
      </span>
    </h1>

    <!-- PLC Model Selection -->
    <div class="selectors">

      <select id="plcModel">

        <option>Allen Bradley - MicroLogix 1400</option>
        <option>Allen Bradley - SLC 500</option>
        <option>Allen Bradley - CompactLogix</option>
        <option>Allen Bradley - ControlLogix</option>

      </select>

    </div>

    <!-- Prompt -->
    <textarea
      id="prompt"
      placeholder="Example:
Generate Emergency Shutdown Logic for Conveyor System with Alarm List and Sequence of Operation">
    </textarea>

    <!-- Buttons -->
    <div class="buttons">

      <button onclick="generateLogic()">
        Generate Logic
      </button>

      <button onclick="downloadPDF()">
        Download PDF
      </button>

    </div>

    <!-- Ladder Logic Area -->
    <div class="ladder-container">

      <svg id="ladderSVG" width="1200" height="700">

        <!-- Rails -->
        <line x1="50" y1="20" x2="50" y2="650" class="rail"/>
        <line x1="1150" y1="20" x2="1150" y2="650" class="rail"/>

      </svg>

    </div>

    <!-- Generated Tables -->
    <div id="outputSection"></div>

  </div>

  <script src="script.js"></script>

</body>

</html>
